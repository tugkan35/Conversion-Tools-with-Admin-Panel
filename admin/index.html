<body class="bg-light">

<section id="borderhead" class="section-box">
    <div class="container">
	    <div class="row">
		    <div class="col-md-6 offset-md-3 text-center">
			    <div class="section-top">
				    <h1>Admin</h1>
					<hr>
				</div>  
			</div>
		</div>	
	</div>
</section>

<div class="container d-flex vh-100">
  <div class="card mx-auto" style="max-width:400px;width:100%;">
    <div class="card-header text-center bg-dark text-white">
	    
        <h3><i class="fas fa-user-lock mr-2"></i>Admin Login</h3>
    </div>
    <div class="card-body">
      <form autocomplete="off" id="formLogin">
	    <input type="hidden" name="csrf_token" value="a81c92ff">
        <div class="form-group">
          <label>User Name</label>
          <input autocomplete="off" type="text" id="loginUsername" class="form-control" placeholder="User Name" name="name" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input autocomplete="off" type="password" id="loginPassword" class="form-control" placeholder="Password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
    </div>
  </div>
</div>
